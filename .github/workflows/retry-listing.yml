name: Retry Listing Build

# A release notification is a one-shot event: if 'Build Repo Listing' fails on a
# transient error (checkout, NuGet restore, GitHub API, Pages deploy), nothing
# would re-deliver it and the listing would stay stale until the next release or
# a manual rerun. The previous scheduled detector got this for free — it recorded
# a release as "seen" only after a successful deploy, so the next check retried.
#
# This restores that safety net without polling: it reacts to the build's own
# completion and re-runs the failed attempt, backing off between tries.
#
# Only dispatched builds are retried: a failed push or manual run is visible to
# whoever started it, whereas a dispatch has no such audience.
#
# A re-run replays the original run's commit SHA, so it cannot be relied on to
# pick up newer commits. What makes re-running safe anyway is that the build does
# not depend on that SHA: build-listing.yml checks out the default branch's
# current HEAD, and the package versions come from release data fetched live. So
# a re-run always produces a listing built from the latest `source.json`, even if
# `source.json` changed after the run it is replaying.

on:
  workflow_run:
    workflows: ["Build Repo Listing"]
    types: [completed]

permissions:
  contents: read
  actions: write # required to re-run the build workflow

jobs:
  retry:
    name: retry-listing-build
    # Dispatched builds only (see above), and at most 3 attempts — each re-run
    # raises `run_attempt`, so this bounds itself instead of looping on a build
    # that is broken for a real reason. A build that hangs past its limit can be
    # reported as `timed_out` rather than `failure`, so both are retried, while
    # `cancelled` is deliberately excluded: that is how the "pages" concurrency
    # group reports a build a newer one superseded.
    if: >-
      github.event.workflow_run.event == 'repository_dispatch' &&
      contains(fromJSON('["failure", "timed_out"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          # Back off before retrying, so a rate limit or a Pages hiccup has time
          # to clear: 60s after the first failure, 120s after the second.
          delay=$((60 * ATTEMPT))
          echo "Build run ${RUN_ID} failed on attempt ${ATTEMPT}; retrying in ${delay}s."
          sleep "$delay"

          # Skip if a newer build has appeared: it already covers this release, so
          # re-running would only spend a run and risk cancelling it through the
          # shared "pages" concurrency group. Run IDs increase monotonically and
          # the API lists newest first, so anything other than our own run at the
          # top means a newer build exists.
          #
          # This is a courtesy check, not a correctness one, and it cannot be made
          # raceless — a build can always start just after it passes. That race is
          # harmless: every build assembles the listing from the default branch's
          # current HEAD and live release data, so no build can publish an obsolete
          # listing over a newer one, whichever order they finish in.
          #
          # Retried too: the step runs under `bash -e`, so a transient failure here
          # would abort before the rerun below is ever attempted.
          latest=''
          for attempt in 1 2 3 4 5; do
            if latest=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/build-listing.yml/runs?per_page=1" \
              --jq '.workflow_runs[0].id // empty'); then
              break
            fi
            latest=''
            if [ "$attempt" -lt 5 ]; then
              echo "Run lookup failed (attempt ${attempt}/5); retrying in $((attempt * 15))s."
              sleep "$((attempt * 15))"
            else
              # Deliberately conservative: without knowing whether a newer build
              # exists, re-running could cancel it and waste a run for nothing.
              # Surface that instead of guessing.
              echo "::error::Could not determine whether a newer build exists;" \
                   "not re-running ${RUN_ID}."
              exit 1
            fi
          done

          if [ -n "$latest" ] && [ "$latest" != "$RUN_ID" ]; then
            echo "Build run ${latest} has started since; it supersedes this retry."
            exit 0
          fi

          # A failure of *this* workflow does not re-trigger it, so if the rerun
          # request itself is refused the build never reaches its next attempt.
          # Retry the request the same way the notifier retries its dispatch.
          for attempt in 1 2 3 4 5; do
            if gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"; then
              echo "Re-run of build ${RUN_ID} requested."
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Re-run request failed (attempt ${attempt}/5); retrying in $((attempt * 15))s."
              sleep "$((attempt * 15))"
            fi
          done
          exit 1

      - name: Note exhausted retries
        if: failure()
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "::warning::Could not re-run build ${RUN_ID}. Rebuild manually from" \
               "Actions → Build Repo Listing → Run workflow."
