name: Build Repo Listing

on:
  # Manual rebuild — also the way to catch up if a release notification was
  # ever missed, since the build always reads the current releases.
  workflow_dispatch:
  # A linked package repository tells us it published a release, which rebuilds
  # the listing within seconds. See notify-listing.yml and the README section
  # "Auto-Updating on New Releases".
  repository_dispatch:
    types: [package-released]
  push:
    branches: main
    paths: source.json

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  
# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true
  
env:
  listPublishDirectory: Website
  pathToCi: ci

jobs:
  
  build-listing:
    name: build-listing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:

      - name: Report trigger
        env:
          RELEASED_REPO: ${{ github.event.client_payload.repository }}
          RELEASED_TAG: ${{ github.event.client_payload.tag }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "Rebuilding: ${RELEASED_REPO:-a linked repository} published ${RELEASED_TAG:-a new release}."
          else
            echo "Rebuilding: triggered by ${{ github.event_name }}."
          fi

      - uses: actions/checkout@v4 # check out this repo
      - uses: actions/checkout@v4 # check out automation repo
        with:
          repository: vrchat-community/package-list-action
          path: ${{env.pathToCi}}
          clean: false # otherwise the local repo will no longer be checked out
          
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{env.pathToCi}}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}
          
      - name: Build Package Version Listing
        run: ${{env.pathToCi}}/build.cmd BuildMultiPackageListing --root ${{env.pathToCi}} --list-publish-directory $GITHUB_WORKSPACE/${{env.listPublishDirectory}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{env.listPublishDirectory}}
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4